name: Release
on:
  push:
    tags: ["*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'MTSWebServices/spark-dialect-extension'  # prevent running on forks

    permissions:
      contents: write # to create Github release

    strategy:
      # Publish both artifacts even if one fails; each job appends its jars to the release.
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - spark-profile: 'spark3'  # Scala 2.12 -> spark-dialect-extension_2.12
            java: '11'
          - spark-profile: 'spark4'  # Scala 2.13 -> spark-dialect-extension_2.13
            java: '17'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - run: ./gradlew jar sourcesJar scaladocJar -PsparkProfile=${{ matrix.spark-profile }}

      - run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache -PsparkProfile=${{ matrix.spark-profile }}
        env:
          # https://vanniktech.github.io/gradle-maven-publish-plugin/central/#in-memory-gpg-key
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PRIVATE_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_PUBLIC_KEY_ID_SHORT }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Create Github release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}
          files: |
            build/libs/spark-dialect-extension*.jar
