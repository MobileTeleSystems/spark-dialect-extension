name: Tests Clickhouse

on:
  push:
    branches:
      - develop
  pull_request:
    branches-ignore:
      - master
  workflow_dispatch:

env:
  MIN_PROJECT_COVERAGE: 80
  MIN_FILE_COVERAGE: 80

jobs:
  tests:
    name: Tests (${{ matrix.spark-profile }}, jdbc ${{ matrix.clickhouse-jdbc-version }})
    runs-on: ubuntu-latest

    permissions:
      contents: read
      checks: write
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        # spark3 -> Scala 2.12 / Spark 3.5 / Java 11
        # spark4 -> Scala 2.13 / Spark 4.x / Java 17
        spark-profile: ['spark3', 'spark4']
        clickhouse-jdbc-version: ['0.7.2', '0.9.8']
        include:
          - spark-profile: 'spark3'
            java: '11'
          - spark-profile: 'spark4'
            java: '17'

    services:
      clickhouse:
        # https://github.com/ClickHouse/clickhouse-java/issues/2636
        image: clickhouse/clickhouse-server:25.9-alpine
        env:
          TZ: UTC
          CLICKHOUSE_DB: spark
          CLICKHOUSE_USER: spark
          CLICKHOUSE_PASSWORD: 123UsedForTestOnly@!
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: '${{ matrix.java }}'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          cache-overwrite-existing: true

      - name: Run Integration Tests with Coverage
        run: |
          ./gradlew test \
            -PsparkProfile=${{ matrix.spark-profile }} \
            -Pclickhouse.jdbc.version=${{ matrix.clickhouse-jdbc-version }}

      - name: Upload coverage results
        if: success() || failure()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.spark-profile }}-jdbc-${{ matrix.clickhouse-jdbc-version }}
          path: '**/build/reports/jacoco/test/*.xml'
          # https://github.com/actions/upload-artifact/issues/602
          include-hidden-files: true

  all_done:
    name: Tests done
    runs-on: ubuntu-latest

    permissions:
      contents: write
      checks: write
      pull-requests: write

    if: success() || failure()
    needs: [tests]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download all coverage reports
        uses: actions/download-artifact@v8
        with:
          path: coverage-reports
          pattern: coverage-*

      - name: Coverage comment
        id: coverage
        uses: madrapps/jacoco-report@v1.7.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          paths: ${{ github.workspace }}/coverage-reports/**/*.xml
          min-coverage-overall: ${{ env.MIN_PROJECT_COVERAGE }}
          min-coverage-changed-files: ${{ env.MIN_FILE_COVERAGE }}
          title: Coverage
          update-comment: true
          skip-if-no-changes: true

      - name: Dynamic Badges
        uses: schneegans/dynamic-badges-action@v1.8.0
        if: github.repository == 'MTSWebServices/spark-dialect-extension' && github.event_name == 'push'
        with:
          auth: ${{ secrets.AUTOMERGE_TOKEN }}
          gistID: 03e73a82ecc4709934540ce8201cc3b4
          filename: spark-dialect-extension_badge.json
          label: Coverage
          message: ${{ steps.coverage.outputs.coverage-overall }}
          color: ${{ steps.coverage.outputs.coverage-overall < env.MIN_PROJECT_COVERAGE && 'red' || 'green' }}
