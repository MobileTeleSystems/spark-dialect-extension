plugins {
    // Third-party plugins applied to the sub-projects (see subprojects {} below);
    // declared here so the plugin artifacts are on the classpath for the whole build.
    // The core `scala` plugin is always on the classpath and is applied directly.
    id "com.github.maiflai.scalatest" version "0.32" apply false
    id "cz.augi.gradle.scalafmt" version "1.21.3" apply false
    id "io.github.cosmicsilence.scalafix" version "0.2.2" apply false
    id "com.vanniktech.maven.publish" version "0.29.0" apply false
    id "net.nemerosa.versioning" version "3.1.0" apply false
}

// ---------------------------------------------------------------------------
// Build profile resolution
// ---------------------------------------------------------------------------
def sparkProfile = providers.gradleProperty("sparkProfile").getOrElse("spark3")

def profiles = [
    spark3: [
        scalaBinaryVersion: "2.12",
        scalaVersion      : "2.12.19",
        sparkVersion      : "3.5.1",
        javaVersion       : 8,
        implProject       : ":spark35",
    ],
    spark4: [
        scalaBinaryVersion: "2.13",
        scalaVersion      : "2.13.17",
        sparkVersion      : "4.1.2",
        javaVersion       : 17,
        implProject       : ":spark41",
    ],
]

if (!profiles.containsKey(sparkProfile)) {
    throw new GradleException(
        "Unknown sparkProfile '${sparkProfile}'. Supported values: 'spark3', 'spark4'.")
}
def profile = profiles[sparkProfile]

allprojects {
    group = "io.github.mtsongithub.doetl"
    version = "0.0.6"

    ext {
        sparkProfileName        = sparkProfile
        scalaBinaryVersion      = profile.scalaBinaryVersion
        scalaFullVersion        = profile.scalaVersion
        sparkVersion            = profile.sparkVersion
        profileJavaVersion      = profile.javaVersion
        implProjectPath         = profile.implProject
        // published artifact name, e.g. spark-dialect-extension_2.12
        publishedArtifactId     = "spark-dialect-extension_${profile.scalaBinaryVersion}"
        clickhouseJdbcVersion   = providers.gradleProperty("clickhouse.jdbc.version").getOrElse("0.9.8")
        isReleaseVersion        = !version.toString().endsWith("SNAPSHOT")
    }

    repositories {
        mavenCentral()
    }
}

// ---------------------------------------------------------------------------
// Shared configuration for the Scala modules (:common and the active impl)
// ---------------------------------------------------------------------------
subprojects {
    apply plugin: "scala"
    apply plugin: "cz.augi.gradle.scalafmt"

    // Scalafix relies on semanticdb-scalac, which is not published for the Scala
    // 2.13 patch that Spark 4 pulls in. Keep Scalafix on the Scala 2.12 profile
    // only; Scalafmt runs on both.
    if (rootProject.ext.scalaBinaryVersion == "2.12") {
        apply plugin: "io.github.cosmicsilence.scalafix"
    }

    java {
        targetCompatibility = JavaVersion.toVersion(rootProject.ext.profileJavaVersion)
    }

    dependencies {
        implementation "org.scala-lang:scala-library:${rootProject.ext.scalaFullVersion}"
        implementation "org.apache.spark:spark-sql_${rootProject.ext.scalaBinaryVersion}:${rootProject.ext.sparkVersion}"
    }

    tasks.withType(ScalaCompile).configureEach {
        scalaCompileOptions.additionalParameters = ["-Ywarn-unused"]
    }
}

task printVersion {
    doLast {
        println project.version
    }
}
